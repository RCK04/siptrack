services:
  app:
    image: siptrack-dev
    build:
      target: development
    command: ["sh", "-c", "bun install --frozen-lockfile && bun scripts/migrate.script.ts && bun run dev"]
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - bun_modules:/app/node_modules

volumes:
  bun_modules:

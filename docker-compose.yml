name: siptrack

services:
  database:
    image: postgres:16-alpine
    container_name: siptrack_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siptrack}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-siptrack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    command: ["sh", "-c", "bun scripts/migrate.script.ts && bun run start"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUN_PUBLIC_CLERK_PUBLISHABLE_KEY: ${BUN_PUBLIC_CLERK_PUBLISHABLE_KEY}
    container_name: siptrack_app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      BUN_PUBLIC_CLERK_PUBLISHABLE_KEY: ${BUN_PUBLIC_CLERK_PUBLISHABLE_KEY}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-siptrack}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
